<div class="list-container">
  <div 
    class="col-12 padding-sm-occ"
    [ngStyle]="{ 'min-height.px': contentHeight }"
  >
    <ngx-datatable *ngIf="dataTable$ | async as dataTable"
        #dataTable
        class="material striped margin-top-xs table-size expandable"
        [columnMode]="'force'"
        [columns]="displayedColumns"
        [rowHeight]="rowHeight"
        [headerHeight]="rowHeight"
        [footerHeight]="rowHeight"
        [externalPaging]="true"
        [count]="dataTable.total"
        [limit]="nbRowsToDisplay"
        [offset]="dataTable.page - 1"
        [rows]="dataTable.items"
        (page)="onPage($event)"
        [sorts]="sorts"
        (sort)="onSort($event)"
    ></ngx-datatable>
  </div>
</div>

<!-- Sur datatable-body-cell pour centrer le contenu des lignes du tableau :
display: flex;
align-items: center; /* centre verticalement */
justify-content: flex-start; /* alignement horizontal inchangé */ -->
