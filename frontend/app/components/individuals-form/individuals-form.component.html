<ng-template #formTemplate>
  <div class="padding-sm">
    <!-- individual_name -->
    <gn-individuals-input-text
      [label]="'Individuals.Individuals.Fields.individual_name' | translate"
      [parentFormControl]="form.get('individual_name')"
      [maxLength]="formConstraints['individual_name'].maxLength"
      [errorKey]="'Individuals.Errors.' + [formConstraints['individual_name'].help] | translate"
      [placeHolder]="'Individuals.Individuals.PlaceHolder.individual_name' | translate"
    ></gn-individuals-input-text>

    <!-- cd_nom : taxon -->
    <pnx-taxonomy
      [ngClass]="'form-group'"
      [label]="'Individuals.Individuals.Filters.cd_nom' | translate"
      [parentFormControl]="$any(form.get('cd_nom'))"
      [idList]="taxonListId"
      [charNumber]="3"
    ></pnx-taxonomy>

    <!-- id_nomenclature_sex -->
    <pnx-nomenclature
      class="form-group"
      [label]="'Individuals.Individuals.Fields.nomenclature_sex_name' | translate"
      [parentFormControl]="$any(form.get('id_nomenclature_sex'))"
      [codeNomenclatureType]="'SEXE'"
      [cdNomenclatures]="[2, 3]"
    ></pnx-nomenclature>

    <!-- active -->
    <gn-individuals-input-radio
      [label]="'Individuals.Individuals.Fields.active' | translate"
      [parentFormControl]="$any(form.get('active'))"
      [inputName]="'active'"
      [options]="[
        { value: true, label: 'Individuals.Others.Yes' | translate },
        { value: false, label: 'Individuals.Others.No' | translate }
      ]"
    ></gn-individuals-input-radio>

    <!-- comment -->
    <gn-individuals-textarea
      [label]="'Individuals.Individuals.Fields.comment' | translate"
      [parentFormControl]="form.get('comment')"
      [maxLength]="formConstraints['comment'].maxLength"
      [errorKey]="'Individuals.Errors.' + [formConstraints['comment'].help] | translate"
      [placeHolder]="'Individuals.Individuals.PlaceHolder.comment' | translate"
    ></gn-individuals-textarea>

    <!-- Additional data -->
    <label>Additional data</label>
    <pnx-dynamic-form-generator
      [autoGenerated]="true"
      [myFormGroup]="form.get('additional_data')"
      [formsDefinition]="additionalFields"
    ></pnx-dynamic-form-generator>

    <!-- deployment data -->
    <h3>deployment</h3>
    <div>
      <div
        *ngFor="let deployment of form.get('deployments').controls; index as i"
        class="shadow p-3 mb-5 bg-white rounded"
      >
        <gn-individuals-deployment-form
          [deploymentsForm]="deployment"
        ></gn-individuals-deployment-form>

        <button
          type="button"
          mat-raised-button
          color="warn"
          class="uppercase"
          (click)="supprimerDeployment(i)"
        >
          {{ 'Actions.Delete' | translate }}
        </button>
      </div>
    </div>
    <button
      type="button"
      mat-raised-button
      color="primary"
      class="uppercase"
      (click)="addDeployment()"
    >
      {{ 'Actions.Add' | translate }}
    </button>
  </div>
</ng-template>

<gn-individuals-form
  *ngIf="formAction === 'ADD'; else editMode"
  [formTitle]="'Individuals.Individuals.Titles.Add' | translate"
  [formTemplate]="formTemplate"
  [formAction]="formAction"
  [objectName]="'individuals'"
  [canSave]="form.valid"
  (save)="onSave()"
></gn-individuals-form>

<ng-template #editMode>
  <!-- <gn-individuals-form
    *ngIf="dataTable$ | async as dataTable"
    [formTitle]="
      'Individuals.Individuals.Titles.Edit' | translate: { id: dataTable.id_tracking_device }
    "
    [formTemplate]="formTemplate"
    [formAction]="formAction"
    [objectName]="'devices'"
    [dataTable]="dataTable"
    [canSave]="form.valid && form.dirty"
    (save)="onSave()"
  ></gn-individuals-form> -->
  <gn-individuals-form
    [formTitle]="'Individuals.Individuals.Titles.Edit' | translate: { id: individualId }"
    [formTemplate]="formTemplate"

    [objectName]="'individuals'"
    [canSave]="form.valid && form.dirty"
    (save)="onSave()"
  ></gn-individuals-form>
</ng-template>
