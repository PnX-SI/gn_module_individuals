<div
  class="form-group"
  [ngClass]="containerClass"
>
  <label class="small">{{ label }}</label>
  <div class="form-check">
    <div *ngFor="let option of options">
      <input
        type="radio"
        class="form-check-input"
        [id]="option.key"
        [value]="option.key"
        [name]="name"
        [formControl]="$any(parentFormControl)"
      />
      <label class="small">
        {{ option.value }}
      </label>
    </div>
  </div>
</div>
