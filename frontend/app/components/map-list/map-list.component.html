<div id="map-list-container">
  <div
    id="map-container"
    [ngStyle]="{ 'min-height.px': contentHeight }"
  >
    <div
      *ngIf="noGeometry"
      class="map-overlay-message"
    >
      {{ noGeometryMessage }}
    </div>
    <pnx-map
      [height]="contentHeight + 'px'"
      [searchBar]="true"
    ></pnx-map>
    <pnx-geojson
      *ngIf="mapReady"
      [geojson]="mapData$ | async"
      [zoomOnLayer]="false"
      [onEachFeature]="onEachFeature.bind(this)"
    ></pnx-geojson>
  </div>

  <div id="list-container">
    <gn-individuals-list
      [idFieldName]="idFieldName"
      [displayedColumnsParams]="displayedColumnsParams"
      [availableColumnsParams]="availableColumnsParams"
      [dataTable$]="datatable$"
      [datatableColumnsLink]="datatableColumnsLink"
      ;
      [nbRowsToDisplay]="nbRowsToDisplay"
      [usePagination]="usePagination"
      [fieldsTranslation]="fieldsTranslation"
      [sorts]="sorts"
      [displayFilterButton]="displayFilterButton"
      [displayExportButton]="displayExportButton"
      [displayAddButton]="displayAddButton"
      [displayInfoButtons]="displayInfoButtons"
      [displaySummaryButtons]="displaySummaryButtons"
      [displayEditButtons]="displayEditButtons"
      [displayDeleteButtons]="displayDeleteButtons"
      [allowedToEdit]="allowedToEdit"
      [allowedToDelete]="allowedToDelete"
      [allowedToAdd]="allowedToAdd"
      [summaryTemplate]="summaryTemplate"
      [filtersTemplate]="filtersTemplate"
      [selectedRows]="selectedRows"
      [exportFormats]="exportFormats"
      (pagination)="onPage($event)"
      (sort)="onSort($event)"
      (select)="onTableSelect($event)"
      (info)="onInfo($event)"
      (add)="onAdd()"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (export)="onExport($event)"
    ></gn-individuals-list>
  </div>
</div>
