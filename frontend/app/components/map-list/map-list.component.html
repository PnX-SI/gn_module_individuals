<div id="map-list-container">
  
  <div id="map-container"
    [ngStyle]="{ 'min-height.px': contentHeight }"
  >
    <pnx-map
      [height]="contentHeight + 'px'"
      [searchBar]="true"
    ></pnx-map>
  </div>

  <div id="list-container">
    <gn-individuals-list
      [objectName]="objectName"
      [idFieldName]="idFieldName"
      [displayedColumnsParams]="displayedColumnsParams"
      [availableColumnsParams]="availableColumnsParams"
      [dataTable$]="dataTable$"
      [nbRowsToDisplay]="nbRowsToDisplay"
      [fieldsTranslation]="fieldsTranslation"
      [sorts]="sorts"
      [allowedToEdit]="allowedToEdit"
      [allowedToDelete]="allowedToDelete"
      [summaryTemplate]="summaryTemplate"
      [filtersTemplate]="filtersTemplate"
      (pagination)="onPage($event)"
      (sort)="onSort($event)"
      (delete)="openDeleteModal($event)"
    ></gn-individuals-list>
  </div>
</div>
