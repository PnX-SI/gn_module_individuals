<div>
  <div class="content row">
    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <pnx-nomenclature
        class="form-group w-50"
        [label]="'Individuals.Deployments.Fields.deployment_type_name' | translate"
        [parentFormControl]="deploymentsForm.get('id_nomenclature_deployment_type')"
        [codeNomenclatureType]="'TYPE_MARQUAGE'"
      ></pnx-nomenclature>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <pnx-autocomplete
        [apiEndPoint]="trackingDevicesApiEndPoint"
        [queryParamSearch]="'search'"
        [parentFormControl]="deploymentsForm.get('id_tracking_device')"
        [formatter]="trackingDevicesformatter"
        [othersGetParams]="trackingDevicesQueryString"
        keyValue="device_label"
        [label]="'Individuals.Deployments.Fields.id_tracking_device' | translate"
      ></pnx-autocomplete>
    </div>

    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <pnx-nomenclature
        class="form-group w-50"
        [label]="'Individuals.Deployments.Fields.deployment_location_name' | translate"
        [parentFormControl]="deploymentsForm.get('id_nomenclature_deployment_location')"
        [codeNomenclatureType]="'LOC_MARQUAGE'"
      ></pnx-nomenclature>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <gn-individuals-input-text
        [label]="'Individuals.Deployments.Fields.marking_code' | translate"
        [containerClass]="'w-50'"
        [parentFormControl]="deploymentsForm.get('marking_code')"
      ></gn-individuals-input-text>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <form [formGroup]="deploymentsForm">
        <label>{{ 'Individuals.Deployments.Fields.install_date' | translate }}</label>
        <input
          class="form-control form-control-sm"
          type="date"
          formControlName="install_date"
        />
      </form>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <gn-individuals-input-text
        [label]="'Individuals.Deployments.Fields.tracking_device_info' | translate"
        [containerClass]="'w-50'"
        [parentFormControl]="deploymentsForm.get('tracking_device_info')"
      ></gn-individuals-input-text>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <form [formGroup]="deploymentsForm">
        <label>{{ 'Individuals.Deployments.Fields.removal_date' | translate }}</label>
        <input
          class="form-control form-control-sm"
          type="date"
          formControlName="removal_date"
        />
      </form>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-4 padding-sm">
      <gn-individuals-input-text
        [label]="'Individuals.Deployments.Fields.comment' | translate"
        [containerClass]="'w-50'"
        [parentFormControl]="deploymentsForm.get('comment')"
      ></gn-individuals-input-text>
    </div>
  </div>
</div>
