<ng-template
 #formTemplate
 let-dataTable="dataTable"
>
  <div class="col-6 padding-sm">

    <!-- id_nomenclature_device_type -->
    <div *ngIf="'id_nomenclature_device_type' as field"
      class="form-group w-50"
    >
      <pnx-nomenclature
        label="{{ 'Individuals.Devices.Fields.' + field | translate }}"
        [parentFormControl]="form.get(field)"
        codeNomenclatureType="TYPE_DISPO_SUIVI"
      ></pnx-nomenclature>
    </div>

    <!-- provider_name -->
    <div *ngIf="'provider_name' as field"
      class="form-group w-50">
      <label class="small">{{ 'Individuals.Devices.Fields.' + field | translate }}</label>
      <input
        type="text"
        class="form-control form-control-sm"
        [formControl]="form.get(field)"
        maxlength="{{ formConstraints[field].maxLength }}"
      />
      <small
        class="text-danger d-block d-flex justify-content-end"
        *ngIf="form.get(field)?.dirty && form.get(field)?.errors?.['pattern']"
      >
        {{ 'Individuals.Errors.' + [formConstraints[field].help] | translate }}
      </small>
    </div>

    <!-- provider_device_id -->
    <div *ngIf="'provider_device_id' as field"
      class="form-group w-50">
      <label class="small">{{ 'Individuals.Devices.Fields.' + field | translate }}</label>
      <input
        type="text"
        class="form-control form-control-sm"
        [formControl]="form.get(field)"
        maxlength="{{ formConstraints[field].maxLength }}"
      />
      <small
        class="text-danger d-block d-flex justify-content-end"
        *ngIf="form.get(field)?.dirty && form.get(field)?.errors?.['pattern']"
      >
        {{ 'Individuals.Errors.' + [formConstraints[field].help] | translate }}
      </small>
    </div> 

    <!-- id_referer -->
    <div *ngIf="'id_referer' as field"
      class="form-group"
    >
      <pnx-observers
        [label]="'Individuals.Devices.Fields.' + field | translate"
        [parentFormControl]="form.get(field)"
        [bindAllItem]="true"
        [placeHolder]="'Sélectionner le référent'"
      ></pnx-observers>
    </div>     

    <!-- comment -->
    <div *ngIf="'comment' as field"
      class="form-group">
      <label class="small">{{'Individuals.Devices.Fields.' + field | translate}}</label>
      <textarea
        type="textarea"
        class="form-control form-control-sm"
        [formControl]="form.get(field)"
      ></textarea>
      <small class="d-flex justify-content-end text-muted">
        {{ form.get(field)?.value?.length || 0 }}/{{ formConstraints[field].maxLength }}
      </small>
      <small
        class="text-danger d-block d-flex justify-content-end"
        *ngIf="form.get(field)?.dirty && form.get(field)?.errors?.['pattern']"
      >
        {{ 'Individuals.Errors.' + [formConstraints[field].help] | translate }}
      </small>
    </div>
  </div>  
</ng-template>

<gn-individuals-form *ngIf="formAction === 'ADD';else editMode"
  [formTitle]="'Individuals.Devices.Titles.Add' | translate"
  [formTemplate]="formTemplate"
  [formAction]="formAction"
  [objectName]="'devices'"
  [canSave]="form.valid"
  (save)="onSave()"
>
</gn-individuals-form>

<ng-template #editMode>
  <gn-individuals-form
    *ngIf="dataTable$ | async as dataTable"
    [formTitle]="'Individuals.Devices.Titles.Edit' | translate:{id:dataTable.id_tracking_device}"
    [formTemplate]="formTemplate"
    [formAction]="formAction"
    [objectName]="'devices'"
    [dataTable]="dataTable"
    [canSave]="form.valid && form.dirty"
    (save)="onSave()"
  >
  </gn-individuals-form>
</ng-template>
