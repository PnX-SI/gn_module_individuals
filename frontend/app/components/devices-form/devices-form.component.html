<ng-template #formTemplate>
  <div class="col-6 padding-sm">
    <!-- id_nomenclature_device_type -->
    <pnx-nomenclature
      class="form-group w-50"
      [label]="'Individuals.Devices.Fields.id_nomenclature_device_type' | translate"
      [parentFormControl]="$any(form.get('id_nomenclature_device_type'))"
      [codeNomenclatureType]="'TYPE_DISPO_SUIVI'"
    ></pnx-nomenclature>

    <!-- provider_name -->
    <gn-individuals-input-text
      [label]="'Individuals.Devices.Fields.provider_name' | translate"
      [containerClass]="'w-50'"
      [parentFormControl]="form.get('provider_name')"
      [maxLength]="formConstraints['provider_name'].maxLength"
      [errorKey]="'Individuals.Errors.' + [formConstraints['provider_name'].help] | translate"
      [placeHolder]="'Individuals.Devices.PlaceHolder.provider_name' | translate"
    ></gn-individuals-input-text>

    <!-- provider_device_id -->
    <gn-individuals-input-text
      [label]="'Individuals.Devices.Fields.provider_device_id' | translate"
      [containerClass]="'w-50'"
      [parentFormControl]="form.get('provider_device_id')"
      [maxLength]="formConstraints['provider_device_id'].maxLength"
      [errorKey]="'Individuals.Errors.' + [formConstraints['provider_device_id'].help] | translate"
      [placeHolder]="'Individuals.Devices.PlaceHolder.provider_device_id' | translate"
    ></gn-individuals-input-text>

    <!-- id_referer -->
    <pnx-observers
      class="form-group"
      [label]="'Individuals.Devices.Fields.id_referer' | translate"
      [parentFormControl]="$any(form.get('id_referer'))"
      [bindAllItem]="true"
      [placeHolder]="'Individuals.Devices.PlaceHolder.id_referer' | translate"
    ></pnx-observers>

    <!-- comment -->
    <gn-individuals-textarea
      [label]="'Individuals.Devices.Fields.comment' | translate"
      [parentFormControl]="form.get('comment')"
      [maxLength]="formConstraints['comment'].maxLength"
      [errorKey]="'Individuals.Errors.' + [formConstraints['comment'].help] | translate"
      [placeHolder]="'Individuals.Devices.PlaceHolder.comment' | translate"
    ></gn-individuals-textarea>
  </div>
</ng-template>

<gn-individuals-form
  *ngIf="formAction === 'ADD'; else editMode"
  [formTitle]="'Individuals.Devices.Titles.Add' | translate"
  [formTemplate]="formTemplate"
  [formAction]="formAction"
  [objectName]="'devices'"
  [canSave]="form.valid"
  (save)="onSave()"
></gn-individuals-form>

<ng-template #editMode>
  <gn-individuals-form
    [formTitle]="'Individuals.Devices.Titles.Edit' | translate: { id: deviceId }"
    [formTemplate]="formTemplate"
    [formAction]="formAction"
    [objectName]="'devices'"
    [canSave]="form.valid && form.dirty"
    (save)="onSave()"
  ></gn-individuals-form>
</ng-template>
