<div class="card card-custom">
  <h2 class="card-header card-header-custom">
    <div>
      {{ formTitle }}
    </div>
    <div>
      <button
        mat-mini-fab
        [matTooltip]="'Individuals.Actions.Cancel' | translate"
        class="mr-1 bg-secondary text-white border-0"
        type="button"
        [disabled]="false"
        (click)="cancel.emit()"
      >
        <mat-icon>close</mat-icon>
      </button>
      <span
        [matTooltip]="
          allowedToSave.message ?? ('Individuals.Actions.Save' | translate)
        "
      >
        <button
          mat-mini-fab
          [matTooltip]="'Individuals.Actions.Save' | translate"
          class="mr-1 bg-success text-white border-0"
          type="button"
          [disabled]="!allowedToSave.access"
          (click)="save.emit()"
        >
          <mat-icon>save</mat-icon>
        </button>
      </span>
    </div>
  </h2>
  <div
    class="card-body"
    id="card-station"
  >
    <ng-container *ngTemplateOutlet="formTemplate"></ng-container>
  </div>
</div>
