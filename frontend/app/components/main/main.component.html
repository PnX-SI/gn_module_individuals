<div class="main-container">
  <div class="tab-map-list-container">
    <nav
      mat-tab-nav-bar
      [tabPanel]="tabPanel"
      id="individuals-tab"
      mat-stretch-tabs="false"
      mat-align-tabs="start"
    >
      <a
        mat-tab-link
        [routerLink]="'individuals'"
        routerLinkActive
        #rla1="routerLinkActive"
        [active]="rla1.isActive"
      >
        {{ 'Individuals.NavigationTabs.Individuals' | translate }}
      </a>
      <a
        mat-tab-link
        [routerLink]="'observations'"
        routerLinkActive
        #rla2="routerLinkActive"
        [active]="rla2.isActive"
      >
        {{ 'Individuals.NavigationTabs.Observations' | translate }}
      </a>
      <a
        mat-tab-link
        [routerLink]="'captures'"
        routerLinkActive
        #rla3="routerLinkActive"
        [active]="rla3.isActive"
      >
        {{ 'Individuals.NavigationTabs.Captures' | translate }}
      </a>
      <a
        mat-tab-link
        [routerLink]="'devices'"
        routerLinkActive
        #rla4="routerLinkActive"
        [active]="rla4.isActive"
      >
        {{ 'Individuals.NavigationTabs.TrackingDevices' | translate }}
      </a>
    </nav>
    <mat-tab-nav-panel #tabPanel>
      <router-outlet></router-outlet>
    </mat-tab-nav-panel>
  </div>
</div>
